<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - E.I.O System</title>
    <link rel="stylesheet" href="design-system.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0A0A0F 0%, #1a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .register-card {
            background: rgba(24, 24, 31, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .register-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .register-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            filter: drop-shadow(0 0 20px rgba(33, 150, 243, 0.6));
        }

        .register-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1976D2 0%, #00ACC1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .register-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(17, 17, 24, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #2196F3;
            background: rgba(17, 17, 24, 0.95);
            box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.1);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1976D2 0%, #00ACC1 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.6);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .register-footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .register-footer p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .register-footer a {
            color: #42A5F5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-footer a:hover {
            color: #2196F3;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            display: none;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #81C784;
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #EF5350;
        }

        .trial-badge {
            display: inline-block;
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 8px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-input {
            padding-right: 50px;
        }

        .btn-toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
            transition: color 0.2s ease;
            line-height: 1;
        }

        .btn-toggle-password:hover {
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <img src="public/assets/official_brand_rocket.png" alt="E.I.O" class="register-logo"
                    onerror="this.style.display='none'">
                <h1 class="register-title">Criar Conta</h1>
                <p class="register-subtitle">Comece sua jornada com E.I.O System</p>
                <span class="trial-badge">🎁 5 Dias Grátis</span>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-input" id="name" name="name" placeholder="Seu nome completo"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" style="color: #E1306C;">📸 Usuário Instagram (@user) *</label>
                    <input type="text" class="form-input" id="instagram_handle" name="instagram_handle"
                        placeholder="@seu_usuario" required style="border-color: rgba(225, 48, 108, 0.3);">
                    <small style="display: block; margin-top: 6px; color: #E1306C; font-size: 0.75rem;">
                        ⚠️ <strong>IMPORTANTE:</strong> Este @ será vinculado à sua licença e usado para login na
                        extensão.
                    </small>
                </div>

                <div class="form-group">
                    <label class="form-label">WhatsApp (com DDD)</label>
                    <input type="tel" class="form-input" id="whatsapp" name="whatsapp" placeholder="21999999999"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="password" name="password"
                            placeholder="Mínimo 6 caracteres" required minlength="6">
                        <button type="button" class="btn-toggle-password" data-target="password" aria-label="Mostrar senha">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmar Senha</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                            placeholder="Digite a senha novamente" required>
                        <button type="button" class="btn-toggle-password" data-target="confirmPassword" aria-label="Mostrar senha">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    Criar Conta Grátis
                </button>
            </form>

            <div class="register-footer">
                <p>Já tem uma conta?</p>
                <a href="login.html">Fazer Login</a>
            </div>
        </div>
    </div>

    <script src="security.js"></script>
    <script src="config.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const instagram_handle = document.getElementById('instagram_handle').value.replace('@', ''); // Remove @ if present
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validações
            if (!name || !email || !whatsapp || !instagram_handle || !password) {
                showAlert('❌ Todos os campos são obrigatórios', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('❌ As senhas não coincidem', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('❌ A senha deve ter no mínimo 6 caracteres', 'error');
                return;
            }

            // Desabilitar botão
            submitBtn.disabled = true;
            submitBtn.textContent = 'Criando conta...';

            try {
                const API_URL = window.EIO_CONFIG?.API_BASE_URL || 'https://eio-system.vercel.app/api/v1';
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, whatsapp, instagram_handle, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✅ Conta criada com sucesso! Redirecionando...', 'success');
                } else {
                    showAlert(`❌ ${data.message || 'Erro ao criar conta'}`, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Criar Conta Grátis';
                }
            } catch (error) {
                console.error('Erro:', error);
                showAlert('❌ Erro ao conectar com servidor. Verifique se o backend está rodando.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Criar Conta Grátis';
            }
        });

        // Toggle password visibility
        document.querySelectorAll('.btn-toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                if (input) {
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    btn.textContent = isPassword ? '🙈' : '👁️';
                }
            });
        });
    </script>
</body>

</html>
